name = "forge-closedml"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# ── Environment Variables ────────────────────────────────────────────────────
# Set these via `wrangler secret put` or in the Cloudflare dashboard
# LITELLM_ENDPOINT  = "http://inference-node-01.internal:4000"  (set via Tunnel)
# MLFLOW_ENDPOINT   = "http://mlflow.internal:5000"             (set via Tunnel)
# API_SECRET        = (generate: openssl rand -hex 32)

[vars]
ENVIRONMENT = "production"
RATE_LIMIT_PER_MINUTE = "120"
ACCESS_AUD = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_JWKS_URL = ""
# Comma-separated allowlist. Requests with an Origin matching any entry get
# that origin reflected back; otherwise the first entry is used (a deny for
# browsers, which is the intended behavior).
CORS_ALLOWED_ORIGIN = "https://closedml.forgecyberdefense.com,https://forge-closedml.pages.dev"

# ── D1 Database (production) ─────────────────────────────────────────────────
# Schema applied 2026-04-22 via MCP d1_database_query (see migrations/0001_initial.sql).
[[d1_databases]]
binding = "DB"
database_name = "forge-closedml-db"
database_id = "783bb9d4-c9d1-4d6e-9a6f-a7c8c0bcb0cc"

# ── R2 Bucket — production model artifact storage ────────────────────────────
[[r2_buckets]]
binding = "MODEL_BUCKET"
bucket_name = "forge-closedml-models"

# ── KV Namespace — production rate-limit + inference cache ───────────────────
[[kv_namespaces]]
binding = "INFERENCE_CACHE"
id = "d58ce5653af64e15938801169b5bd95d"

# ── Development ──────────────────────────────────────────────────────────────
[dev]
port = 8787

# ── Staging Environment ──────────────────────────────────────────────────────
# Staging KV + R2 provisioned 2026-04-22 via MCP. Staging D1 is currently
# blocked by the 10-database-per-account Cloudflare limit (see README
# "Known pilot constraints"). Until the limit is raised, staging shares the
# production D1 but stamps ENVIRONMENT=staging on audit rows for filtering.
# TODO(pilot): create `forge-closedml-db-staging` and paste the id below once
# the account limit is raised, then remove the shared-DB note from README.
[env.staging]
name = "forge-closedml-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
RATE_LIMIT_PER_MINUTE = "120"
ACCESS_AUD = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_JWKS_URL = ""
CORS_ALLOWED_ORIGIN = "https://closedml-staging.forgecyberdefense.com,https://forge-closedml.pages.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "forge-closedml-db"
database_id = "783bb9d4-c9d1-4d6e-9a6f-a7c8c0bcb0cc"  # shared with prod until dedicated staging DB exists

[[env.staging.r2_buckets]]
binding = "MODEL_BUCKET"
bucket_name = "forge-closedml-models-staging"

[[env.staging.kv_namespaces]]
binding = "INFERENCE_CACHE"
id = "a9716d672f8a428eaaf68901cd612955"
