model_list:
  - model_name: forge-compliance
    litellm_params:
      model: ollama/forge-compliance-v1
      api_base: http://ollama:11434
      temperature: 0.1
      max_tokens: 4096

litellm_settings:
  json_logs: true
  request_timeout: 120
  num_retries: 2
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
