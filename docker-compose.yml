services:
  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    environment: ["OLLAMA_HOST=0.0.0.0"]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["./config/litellm-config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on: [ollama, redis]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    ports: ["127.0.0.1:5000:5000"]
    command: mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes: ["mlflow-data:/mlflow"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./config/cloudflared-tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./config/cloudflared:/etc/cloudflared:ro
    depends_on: [litellm, mlflow]

  redis:
    image: redis:7-alpine
    profiles: ["optional"]
    ports: ["127.0.0.1:6379:6379"]

volumes:
  ollama-models:
  mlflow-data:
